{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="form-page">
    <form class="form-card" method="post">
        <div class="section-heading"><p class="eyebrow">Account access</p><h1>Log in</h1></div>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
        <p style="text-align:right;margin:4px 0 10px 0;"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
        <button class="button primary full" type="submit">Log in</button>
        <p class="muted">New patient? <a href="{{ url_for('register') }}">Create an account</a></p>
    </form>
</div>
{% endblock %}
