{% extends "base.html" %}
{% block content %}
<div class="form-card" style="max-width:420px;margin:60px auto;">
<p class="eyebrow">Password recovery</p>
<h2>Forgot Password</h2>
<p style="color:#666;">Enter your email to get a reset link</p>
<form method="post">
<label>Email<input type="email" name="email" required></label>
<button class="button primary full" type="submit">Send Reset Link</button>
</form>
<p style="margin-top:15px;text-align:center;"><a href="/login">Back to login</a></p>
</div>
{% endblock %}
